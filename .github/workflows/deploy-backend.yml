name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: [self-hosted, eduhub]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy production env
        run: cp /home/nexus/eduhub/.env .env

      - name: Build and restart container
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for API to come up
        run: |
          for i in $(seq 1 30); do
            if docker exec eduhub-api-prod node -e "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker logs eduhub-api-prod --tail 100
          exit 1
